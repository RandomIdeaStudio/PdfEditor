name: CI

# Studio rule: run only by hand (Actions -> CI -> Run workflow) to save Actions minutes.
on:
  workflow_dispatch:
    inputs:
      build_exe:
        description: "Also build Windows installer executable artifact"
        required: false
        default: true
        type: boolean
      sign:
        description: "Submit the built executable to SignPath for code signing (needs build_exe)"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        shell: pwsh
        run: .\scripts\test.ps1

      - name: Build Windows executable
        if: ${{ inputs.build_exe }}
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Upload unsigned Windows installer artifact
        id: upload-unsigned-artifact
        if: ${{ inputs.build_exe }}
        uses: actions/upload-artifact@v4
        with:
          name: PdfEditor-windows-x64-unsigned
          path: dist/PdfEditor_Setup_v*.exe
          if-no-files-found: error

      # Free code signing provided by SignPath.io, certificate by SignPath Foundation.
      # Needs the repository secret SIGNPATH_API_TOKEN and the repository variables
      # SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG and SIGNPATH_SIGNING_POLICY_SLUG.
      - name: Submit signing request to SignPath
        if: ${{ inputs.build_exe && inputs.sign }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed

      - name: Upload signed Windows installer artifact
        if: ${{ inputs.build_exe && inputs.sign }}
        uses: actions/upload-artifact@v4
        with:
          name: PdfEditor-windows-x64-signed
          path: dist/signed/*
          if-no-files-found: error
