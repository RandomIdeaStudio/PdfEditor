name: CI

# Studio rule: run only by hand (Actions -> CI -> Run workflow) to save Actions minutes.
on:
  workflow_dispatch:
    inputs:
      build_exe:
        description: "Also build Windows installer executable artifact"
        required: false
        default: true
        type: boolean

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        shell: pwsh
        run: .\scripts\test.ps1

      - name: Build Windows executable
        if: ${{ inputs.build_exe }}
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Upload Windows installer artifact
        if: ${{ inputs.build_exe }}
        uses: actions/upload-artifact@v4
        with:
          name: PdfEditor-windows-x64
          path: dist/PdfEditor_Setup_v1.0.0.exe
